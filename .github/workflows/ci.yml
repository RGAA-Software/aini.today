name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Test API
        run: dotnet test Aini.slnx --configuration Release
      - name: Build web
        working-directory: web
        run: |
          npm ci
          npm run build

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      REGISTRY: ccr.ccs.tencentyun.com
      SSHPASS: ${{ secrets.DEPLOY_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build deployment package
        run: |
          mkdir -p /tmp/aini-package
          git archive "$GITHUB_SHA" | tar -x -C /tmp/aini-package
          dotnet publish src/Aini.Api/Aini.Api.csproj --configuration Release --output /tmp/aini-package/artifacts/api /p:UseAppHost=false
          dotnet publish src/Aini.WebHost/Aini.WebHost.csproj --configuration Release --output /tmp/aini-package/artifacts/web /p:UseAppHost=false
          cd web
          npm ci
          npm run build
          mkdir -p /tmp/aini-package/artifacts/web/wwwroot
          cp -R dist/. /tmp/aini-package/artifacts/web/wwwroot/
          tar -C /tmp/aini-package -czf /tmp/aini-source.tar.gz .
      - name: Install SSH client helper
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass
      - name: Upload source package
        run: |
          sshpass -e ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -o StrictHostKeyChecking=accept-new "${{ secrets.DEPLOY_SSH_USER }}@${{ secrets.DEPLOY_SSH_HOST }}" "mkdir -p /opt/aini/packages"
          sshpass -e scp -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -o StrictHostKeyChecking=accept-new /tmp/aini-source.tar.gz "${{ secrets.DEPLOY_SSH_USER }}@${{ secrets.DEPLOY_SSH_HOST }}:/opt/aini/packages/$GITHUB_SHA.tar.gz"
      - name: Log in to Tencent Cloud registry
        env:
          TCR_PASSWORD: ${{ secrets.TCR_PASSWORD }}
          TCR_USERNAME: ${{ secrets.TCR_USERNAME }}
        run: |
          printf '%s' "$TCR_PASSWORD" | sshpass -e ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -o StrictHostKeyChecking=accept-new "${{ secrets.DEPLOY_SSH_USER }}@${{ secrets.DEPLOY_SSH_HOST }}" "docker login '$REGISTRY' --username '$TCR_USERNAME' --password-stdin"
      - name: Build, publish, and deploy in Beijing
        run: |
          sshpass -e ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -o StrictHostKeyChecking=accept-new "${{ secrets.DEPLOY_SSH_USER }}@${{ secrets.DEPLOY_SSH_HOST }}" "bash -s -- '$GITHUB_SHA'" < deploy/deploy.sh
